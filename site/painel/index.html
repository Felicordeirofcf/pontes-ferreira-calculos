<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Painel · Pontes Ferreira Cálculos Judiciais</title>
<link rel="icon" href="/img/marca.svg" type="image/svg+xml">
<meta name="theme-color" content="#060f26">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#f4f3ef; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
    --brand:#0f1b2d; --gold:#e0a526;
    --s1:#2a78d6; --s2:#eb6834;
    --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
    --r:12px;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--page);color:var(--ink);font-size:14px;line-height:1.45}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--s1)}
  .app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
  nav{background:var(--brand);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
  nav .marca{font-weight:700;font-size:15px;padding:4px 10px 18px;line-height:1.25}
  nav .marca span{display:block;color:var(--gold);font-weight:600;font-size:12px}
  nav a{color:#d7dde6;text-decoration:none;padding:9px 10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
  nav a:hover{background:rgba(255,255,255,.06)}
  nav a.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
  nav .pill{background:var(--crit);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
  nav .rodape{margin-top:auto;font-size:12px;color:#9aa6b6;padding:10px}
  nav .rodape button{background:none;border:0;color:#d7dde6;cursor:pointer;text-decoration:underline;padding:0}
  main{padding:22px 28px 60px;min-width:0}
  .topo{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .topo h1{font-size:22px}
  .acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
  .btn.sec{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ring)}
  .btn.ouro{background:var(--gold);color:var(--ink)}
  .btn.mini{padding:4px 9px;font-size:12px}
  .btn.perigo{background:none;color:var(--crit);box-shadow:inset 0 0 0 1px var(--crit)}
  select.f,input.f{background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:7px 10px}
  .demo{background:#fff4dc;border:1px solid var(--gold);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}

  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--surface);border-radius:var(--r);box-shadow:0 0 0 1px var(--ring);padding:14px 16px}
  .kpi .rot{color:var(--ink-2);font-size:12px}
  .kpi .val{font-size:24px;font-weight:700;margin-top:2px}
  .kpi .sub{color:var(--muted);font-size:12px}
  .kpi.alerta .val{color:var(--crit)}

  .grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .card{background:var(--surface);border-radius:var(--r);box-shadow:0 0 0 1px var(--ring);padding:16px 18px;min-width:0}
  .card h2{font-size:15px;margin-bottom:2px}
  .card .desc{color:var(--muted);font-size:12px;margin-bottom:12px}
  .card.larga{grid-column:1/-1}
  .legenda{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:6px}
  .legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  svg.chart{width:100%;height:auto;display:block}
  svg.chart text{font-size:11px;fill:var(--muted)}
  .hb{display:grid;grid-template-columns:120px 1fr 70px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
  .hb .barra{height:14px;background:var(--grid);border-radius:4px;overflow:hidden}
  .hb .barra div{height:100%;border-radius:0 4px 4px 0}
  .hb .num{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
  #tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;opacity:0;transition:opacity .1s;z-index:99;white-space:pre}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--ink-2);font-weight:600;padding:8px;border-bottom:1px solid var(--axis);white-space:nowrap}
  td{padding:8px;border-bottom:1px solid var(--grid);vertical-align:middle}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  tr.clic:hover td{background:#f3f2ec;cursor:pointer}
  .tabela{overflow-x:auto}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;white-space:nowrap}
  .t-crit{background:#fbe3e3;color:#8f1f1f}
  .t-warn{background:#fff1cf;color:#6b4a00}
  .t-good{background:#dff3df;color:var(--good-ink)}
  .t-neutro{background:#ecebe6;color:var(--ink-2)}
  .t-azul{background:#dfeafa;color:#184f95}
  .vazio{color:var(--muted);padding:16px 0;text-align:center}

  .kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto}
  .col{background:#ebeae4;border-radius:var(--r);padding:10px;min-height:200px}
  .col h3{font-size:13px;display:flex;justify-content:space-between;margin:2px 4px 10px}
  .lead{background:var(--surface);border-radius:10px;box-shadow:0 0 0 1px var(--ring);padding:10px 12px;margin-bottom:8px}
  .lead b{display:block}
  .lead .meta{color:var(--ink-2);font-size:12px;margin:3px 0 8px}
  .lead .linha{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .lead.urgente{box-shadow:0 0 0 2px var(--crit)}

  .modal-fundo{position:fixed;inset:0;background:rgba(11,11,11,.45);display:grid;place-items:center;z-index:50;padding:16px}
  .modal{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:22px}
  .modal h2{margin-bottom:14px;font-size:18px}
  .campos{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  .campos .full{grid-column:1/-1}
  .campos label{display:block;font-size:12px;color:var(--ink-2);font-weight:600;margin-bottom:3px}
  .campos input,.campos select,.campos textarea{width:100%;border:1px solid var(--axis);border-radius:8px;padding:8px 10px;background:#fff}
  .campos .chk{display:flex;gap:8px;align-items:center;padding-top:20px}
  .campos .chk input{width:auto}
  .modal .rodape{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

  #toast{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:60}
  #toast div{background:var(--brand);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:340px}

  .login{min-height:100vh;display:grid;place-items:center;background:var(--brand)}
  .login form{background:var(--surface);padding:28px;border-radius:14px;width:min(360px,92vw);display:grid;gap:10px}
  .login input{border:1px solid var(--axis);border-radius:8px;padding:10px}

  /* CRM */
  .seg{display:inline-flex;background:#e6e5df;border-radius:9px;padding:3px;gap:2px}
  .seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--ink-2)}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .link{cursor:pointer}.link:hover{text-decoration:underline}
  .linha{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .retorno{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--grid);flex-wrap:wrap}
  .retorno .meta{color:var(--ink-2);font-size:12px;margin-top:3px}
  .modal.ficha{width:min(980px,100%)}
  .ficha-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
  .ficha-grade{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .dado{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--grid);font-size:13px}
  .dado span{color:var(--ink-2)}.dado b{font-weight:600;text-align:right}
  .dado.clic{cursor:pointer}.dado.clic:hover{background:#f3f2ec}
  .obs{background:#f3f2ec;border-radius:8px;padding:8px 10px;margin-top:10px;font-size:13px;white-space:pre-wrap}
  .rotulo{display:block;font-size:12px;color:var(--ink-2);font-weight:600;margin-bottom:5px}
  .nova-ativ{display:grid;grid-template-columns:150px 1fr;gap:6px;margin-bottom:14px}
  .nova-ativ select,.nova-ativ textarea{border:1px solid var(--axis);border-radius:8px;padding:7px 9px;background:#fff}
  .nova-ativ textarea{grid-column:1/-1;resize:vertical}
  .nova-ativ .btn{grid-column:2;justify-self:end}
  h3.sub{font-size:13px;margin:16px 0 6px;color:var(--ink-2)}
  .timeline{max-height:340px;overflow:auto;border-left:2px solid var(--grid);padding-left:12px}
  .ativ{font-size:13px;padding:6px 0;position:relative}
  .ativ::before{content:"";position:absolute;left:-17px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--axis)}
  .ativ .quando{display:block;color:var(--muted);font-size:11px}

  /* WhatsApp */
  .wa{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 130px);min-height:480px;background:var(--surface);border-radius:var(--r);box-shadow:0 0 0 1px var(--ring);overflow:hidden}
  .wa-lista{border-right:1px solid var(--grid);overflow:auto;padding:10px}
  .wa-lista input{width:100%;margin-bottom:8px}
  .wa-item{padding:10px;border-radius:9px;cursor:pointer;margin-bottom:2px}
  .wa-item:hover{background:#f3f2ec}.wa-item.on{background:#e6efe9}
  .wa-l1,.wa-l2{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .wa-l1 span{color:var(--muted);font-size:11px;white-space:nowrap}
  .wa-l2 span{color:var(--ink-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wa-l2 i{font-style:normal;background:#1f8a5b;color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
  .wa-l3{font-size:11px;color:var(--muted);margin-top:2px}
  .wa-chat{display:flex;flex-direction:column;min-width:0;min-height:0}
  .wa-vazio{margin:auto;color:var(--muted)}
  .wa-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--grid);flex-wrap:wrap}
  .wa-janela{font-size:12px;padding:7px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .wa-janela.ok{background:#e3f6ea;color:#14532d}.wa-janela.fechada{background:#fff1cf;color:#6b4a00}
  .wa-msgs{flex:1;overflow:auto;padding:14px 18px;background:#efeae2;display:flex;flex-direction:column;gap:6px}
  .wa-msg{max-width:70%;padding:7px 10px 5px;border-radius:10px;font-size:14px;box-shadow:0 1px 1px rgba(0,0,0,.08);word-wrap:break-word}
  .wa-msg.in{background:#fff;align-self:flex-start;border-top-left-radius:2px}
  .wa-msg.out{background:#d9fdd3;align-self:flex-end;border-top-right-radius:2px}
  .wa-hora{display:block;text-align:right;font-size:11px;color:#667781;margin-top:2px}
  .wa-arq{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:rgba(0,0,0,.04);border-radius:7px;padding:6px 8px;margin-bottom:4px;font-size:13px}
  .wa-dia{align-self:center;background:#fff;color:#54656f;font-size:11px;padding:3px 10px;border-radius:7px;margin:6px 0;box-shadow:0 1px 1px rgba(0,0,0,.06)}
  .wa-compor{display:grid;grid-template-columns:170px 1fr auto auto;gap:8px;padding:10px;border-top:1px solid var(--grid);align-items:end}
  .wa-compor textarea{border:1px solid var(--axis);border-radius:10px;padding:9px 11px;resize:none;background:#fff;max-height:140px}
  .wa-compor textarea:disabled,.wa-compor .btn:disabled{opacity:.5;cursor:not-allowed}

  @media (max-width:900px){
    .ficha-grade{grid-template-columns:1fr}
    .wa{grid-template-columns:1fr;height:auto}
    .wa-lista{max-height:240px;border-right:0;border-bottom:1px solid var(--grid)}
    .wa-msgs{min-height:340px}
    .wa-compor{grid-template-columns:1fr auto auto}
    .wa-compor select{grid-column:1/-1}
  }
  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px}
    nav .marca{width:100%;padding-bottom:6px}
    nav .rodape{display:none}
    .grade{grid-template-columns:1fr}
    main{padding:16px}
    .campos{grid-template-columns:1fr}
  }
  /* Tráfego pago */
  .passo .passo-topo{display:flex;gap:10px;align-items:center;margin-bottom:6px}
  .passo .passo-topo h2{margin:0}
  .passo .passo-topo input{width:18px;height:18px;cursor:pointer}
  .passo-auto{font-size:17px}
  .passo.ok{border-left:4px solid var(--good)}
  .passo:not(.ok){border-left:4px solid var(--axis)}
  .passo-corpo ol,.passo-corpo ul{margin:6px 0 0 20px;display:grid;gap:6px;line-height:1.5}
  .passo-corpo p{line-height:1.5;margin:6px 0}
  .passo-corpo a,.camp a{color:var(--s1);font-weight:600}
  code{background:#f0efe9;border-radius:5px;padding:1px 5px;font-size:12.5px}
  .alerta-linha{padding:8px 0;border-top:1px solid var(--grid);line-height:1.5}
  .alerta-linha:first-of-type{border-top:0}
  .verba{position:relative;height:12px;background:#ecebe5;border-radius:6px;margin-top:6px;overflow:visible}
  .verba div{height:100%;border-radius:6px}
  .verba i{position:absolute;top:-4px;width:2px;height:20px;background:var(--ink)}
  .kit{margin:6px 0 0 18px;line-height:1.6}
  .kit-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .kit-bloco{border:1px solid var(--grid);border-radius:10px;padding:10px;display:grid;gap:6px;align-content:start}
  .kit-linha{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px dashed var(--grid);padding:5px 0}
  .chars{font-size:11px;color:var(--muted);white-space:nowrap}
  .kit-tags{display:flex;flex-wrap:wrap;gap:5px}
  .kit-texto{white-space:pre-wrap;background:#f7f6f2;border-radius:8px;padding:8px;font-size:13px;line-height:1.5}
  .camp h3.sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .link-gerado{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;background:#f7f6f2;border-radius:10px;padding:10px}
  .link-gerado code{word-break:break-all;background:none;flex:1;min-width:200px}
  .wa-bot{display:block;font-size:10.5px;font-weight:700;color:#1f8a5b;margin-bottom:2px}
  .sim-info{align-self:center;background:#fff8dc;color:#5c4400;font-size:12px;border-radius:8px;padding:5px 10px;max-width:90%;text-align:center}

  /* ================= Tema 2026 · "toga e selo" ================= */
  :root{
    --toga:#0b1626; --toga-2:#14233a; --papel:#eef1f5; --folha:#ffffff; --selo:#e3a82b; --selo-claro:#fbefd2;
    --page:var(--papel); --surface:var(--folha); --ink:#13213a; --ink-2:#4a5870; --muted:#8693a7;
    --grid:#e4e9ef; --axis:#cfd7e1; --ring:rgba(19,33,58,.08); --brand:var(--toga); --gold:var(--selo);
    --r:16px; --sombra:0 1px 2px rgba(19,33,58,.04),0 6px 24px -8px rgba(19,33,58,.10);
    --f-tit:"Bricolage Grotesque",system-ui,sans-serif; --f-txt:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"JetBrains Mono",ui-monospace,monospace;
    font-family:var(--f-txt);
  }
  body{font-size:14px;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--selo-claro)}
  :focus-visible{outline:2px solid var(--selo);outline-offset:2px;border-radius:6px}
  .app{grid-template-columns:248px 1fr}

  /* menu lateral */
  nav{background:radial-gradient(120% 60% at 0% 0%,#1b2f4f 0%,transparent 60%),var(--toga);padding:18px 14px;gap:2px;overflow-y:auto}
  nav .marca{display:flex;gap:10px;align-items:center;padding:4px 6px 16px;font-family:var(--f-tit);font-weight:700;font-size:16px;letter-spacing:-.01em}
  nav .marca small{display:block;font-family:var(--f-txt);font-weight:500;font-size:11.5px;color:var(--selo);letter-spacing:.02em}
  nav .marca .selo{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(140deg,#f2c45a,#c98d16);color:var(--toga);font-size:14px;font-weight:800;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),0 6px 16px -6px rgba(227,168,43,.7)}
  .busca-btn{display:flex;align-items:center;gap:8px;width:100%;margin:2px 0 10px;padding:9px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.05);color:#aab6c8;cursor:pointer;font-size:13px;text-align:left}
  .busca-btn:hover{background:rgba(255,255,255,.09);color:#fff}
  .busca-btn svg,.paleta-in svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;flex:none}
  .busca-btn kbd{margin-left:auto}
  kbd{font-family:var(--f-num);font-size:10.5px;padding:2px 6px;border-radius:6px;border:1px solid currentColor;opacity:.75;white-space:nowrap}
  nav .grupo{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6f7f97;font-weight:600;padding:14px 10px 6px}
  nav a{gap:10px;justify-content:flex-start;color:#c3cddb;padding:8px 10px;border-radius:10px;position:relative;font-weight:500;transition:background .15s,color .15s}
  nav a .rot{flex:1}
  nav a .ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85;flex:none}
  nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  nav a.on{background:rgba(227,168,43,.12);color:#fff;font-weight:600}
  nav a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--selo)}
  nav a.on .ic{color:var(--selo);opacity:1}
  nav .pill{background:#e5484d;font-family:var(--f-num);font-size:10.5px;padding:1px 7px;box-shadow:0 0 0 2px var(--toga)}
  nav .rodape{display:flex;flex-direction:column;gap:4px;color:#8796ad;padding:12px 10px 4px;border-top:1px solid rgba(255,255,255,.08);margin-top:auto}
  nav .rodape .ponto{display:inline-block;width:7px;height:7px;border-radius:50%;background:#30c48d;margin-right:7px;box-shadow:0 0 0 3px rgba(48,196,141,.2)}
  nav .rodape .ponto.demo-p{background:var(--selo);box-shadow:0 0 0 3px rgba(227,168,43,.2)}
  nav .rodape button{color:#c3cddb;text-decoration:none;font-size:12px}
  nav .rodape button:hover{color:#fff;text-decoration:underline}

  /* área principal */
  main{padding:26px 34px 70px;max-width:1500px}
  main.entra{animation:entra .28s cubic-bezier(.2,.7,.2,1)}
  @keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .topo{margin-bottom:22px}
  .topo h1{font-family:var(--f-tit);font-size:30px;font-weight:700;letter-spacing:-.025em}
  .btn{border-radius:10px;padding:9px 15px;font-weight:600;transition:transform .12s,box-shadow .15s,background .15s;background:var(--toga)}
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(11,22,38,.6)}
  .btn:active{transform:none}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
  .btn.sec{background:var(--folha);box-shadow:inset 0 0 0 1px var(--axis)}
  .btn.sec:hover{box-shadow:inset 0 0 0 1px var(--ink-2),0 4px 12px -8px rgba(11,22,38,.4)}
  .btn.ouro{background:var(--selo);color:var(--toga)}
  .btn.mini{padding:4px 10px;font-size:12px;border-radius:8px}
  select.f,input.f{border-radius:10px;border-color:var(--axis);padding:8px 11px;transition:border-color .15s,box-shadow .15s}
  select.f:focus,input.f:focus,.campos input:focus,.campos select:focus,.campos textarea:focus{outline:none;border-color:var(--selo);box-shadow:0 0 0 3px rgba(227,168,43,.18)}
  .demo{background:var(--selo-claro);border:0;box-shadow:inset 0 0 0 1px rgba(227,168,43,.45);border-radius:12px}

  /* números */
  .kpis{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:20px}
  .kpi{border-radius:var(--r);box-shadow:var(--sombra);border:1px solid var(--grid);padding:16px 18px;transition:transform .18s,box-shadow .18s}
  .kpi:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(19,33,58,.04),0 14px 30px -12px rgba(19,33,58,.22)}
  .kpi .rot{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
  .kpi .val{font-family:var(--f-tit);font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:4px;line-height:1.1}
  .kpi .sub{margin-top:4px}
  .kpi.alerta{border-color:#f3c2c2;background:linear-gradient(180deg,#fff,#fff7f7)}

  /* cartões */
  .grade{gap:16px}
  .card{border-radius:var(--r);box-shadow:var(--sombra);border:1px solid var(--grid);padding:18px 20px}
  .card h2{font-family:var(--f-tit);font-size:17px;font-weight:700;letter-spacing:-.01em}
  .card .desc{font-size:12.5px}
  .seg{background:#e2e7ee;border-radius:11px;padding:3px}
  .seg button{border-radius:8px;transition:background .15s,color .15s}
  .seg button.on{box-shadow:0 1px 2px rgba(19,33,58,.12),0 2px 8px -4px rgba(19,33,58,.2)}
  .seg button:not(.on):hover{color:var(--ink)}

  /* tabelas */
  th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--grid);padding:10px 10px;position:sticky;top:0;background:var(--folha);z-index:1}
  td{padding:10px 10px;border-bottom:1px solid #eef2f6}
  td.n{font-family:var(--f-num);font-size:12.5px}
  tr:hover td{background:#f8fafc}
  tr.clic:hover td{background:#fbf5e6}
  .tag{border-radius:7px;padding:3px 8px}
  .t-neutro{background:#edf0f4;color:var(--ink-2)}
  .t-azul{background:#e3edfb;color:#1c4f95}
  .mono{font-family:var(--f-num);font-size:.92em}

  /* kanban de leads */
  .col{background:#e5eaf0;border-radius:var(--r)}
  .lead{border-radius:12px;box-shadow:0 1px 2px rgba(19,33,58,.06);border:1px solid var(--grid);transition:transform .15s,box-shadow .15s}
  .lead:hover{transform:translateY(-1px);box-shadow:0 8px 20px -10px rgba(19,33,58,.3)}

  /* janelas */
  .modal-fundo{background:rgba(11,22,38,.45);backdrop-filter:blur(3px);animation:fade .15s ease}
  .modal{border-radius:18px;box-shadow:0 30px 80px -20px rgba(11,22,38,.5);animation:sobe .2s cubic-bezier(.2,.7,.2,1)}
  .modal h2{font-family:var(--f-tit);font-size:21px;letter-spacing:-.015em}
  .campos input,.campos select,.campos textarea{border-radius:10px;border-color:var(--axis);padding:9px 11px}
  @keyframes fade{from{opacity:0}}
  @keyframes sobe{from{opacity:0;transform:translateY(10px) scale(.98)}}
  #toast div{background:var(--toga);border-radius:12px;box-shadow:0 12px 30px -10px rgba(11,22,38,.6);animation:sobe .2s ease;border-left:3px solid var(--selo)}
  #tip{background:var(--toga);border-radius:8px;padding:8px 10px;line-height:1.45;box-shadow:0 8px 24px -8px rgba(0,0,0,.4)}
  .login{background:radial-gradient(90% 70% at 15% 10%,#1d3557 0%,transparent 60%),var(--toga)}
  .login form{border-radius:20px;padding:32px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
  .login h2{font-family:var(--f-tit);font-size:26px;letter-spacing:-.02em}
  .login input{border-radius:10px;padding:11px 12px}

  /* busca rápida (Ctrl+K) */
  .paleta-fundo{position:fixed;inset:0;z-index:80;background:rgba(11,22,38,.4);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;animation:fade .12s ease}
  .paleta{width:min(640px,100%);background:var(--folha);border-radius:18px;box-shadow:0 40px 100px -20px rgba(11,22,38,.55),0 0 0 1px rgba(19,33,58,.08);overflow:hidden;animation:sobe .18s cubic-bezier(.2,.7,.2,1)}
  .paleta-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--grid);color:var(--muted)}
  .paleta-in input{flex:1;border:0;outline:none;font-size:16px;background:none;color:var(--ink)}
  .paleta-lista{max-height:min(420px,55vh);overflow-y:auto;padding:6px}
  .paleta-g{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 10px 4px}
  .paleta-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;cursor:pointer}
  .paleta-item.on{background:#f6efdc}
  .paleta-ic{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#eef1f5;color:var(--ink-2);flex:none;font-weight:700}
  .paleta-item.on .paleta-ic{background:var(--selo);color:var(--toga)}
  .paleta-ic .ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .paleta-t{flex:1;min-width:0;display:flex;flex-direction:column}
  .paleta-t b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .paleta-t small{color:var(--muted);font-size:12px}
  .paleta-ent{color:var(--muted);opacity:0}.paleta-item.on .paleta-ent{opacity:1}
  .paleta-pe{display:flex;gap:16px;padding:9px 14px;border-top:1px solid var(--grid);font-size:11.5px;color:var(--muted)}
  .paleta-pe kbd{margin-right:3px}

  /* mapa do Brasil */
  svg.mapa-br{width:100%;max-width:440px;height:auto;display:block;margin:4px auto 0}
  .uf-cel rect{transition:transform .15s,filter .15s;transform-box:fill-box;transform-origin:center}
  .uf-cel:hover rect{transform:scale(1.06);filter:drop-shadow(0 6px 10px rgba(19,33,58,.25))}
  .legenda.escala{justify-content:center;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
  .legenda.escala .sw{display:inline-block;width:22px;height:10px;border-radius:3px;margin:0}

  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    nav{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;padding:8px 10px;gap:6px;overflow-x:auto;overflow-y:hidden}
    nav .marca{width:auto;padding:0 6px 0 0;font-size:0}
    nav .marca small{display:none}
    nav .busca-btn{width:auto;margin:0;flex:none}
    nav .busca-btn kbd,nav .grupo,nav .rodape{display:none}
    nav .itens{display:flex;gap:4px}
    nav a{flex:none;white-space:nowrap}
    nav a.on::before{display:none}
    main{padding:16px}
    .topo h1{font-size:24px}
  }
  .tel-cel{display:flex;align-items:center;gap:8px}
  .tel{font-size:12.5px;color:var(--ink)}
  .wa-bolha{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;border:0;background:#25d366;color:#fff;cursor:pointer;box-shadow:0 4px 12px -4px rgba(37,211,102,.7);transition:transform .15s,box-shadow .15s;flex:none}
  .wa-bolha svg{width:18px;height:18px}
  .wa-bolha:hover{transform:scale(1.1);box-shadow:0 6px 16px -4px rgba(37,211,102,.9)}
  .wa-bolha.conversa{background:#e9f9ef;color:#128c4a;box-shadow:inset 0 0 0 1px #b6ebc9}
  .mail-bolha{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;border:0;background:#e3edfb;color:#1c4f95;cursor:pointer;font-size:14px;transition:transform .15s;flex:none}
  .mail-bolha:hover{transform:scale(1.1)}
  .wa-conexao{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;margin-bottom:14px;background:#edf0f4;border:1px solid var(--grid)}
  .wa-conexao.ok{background:#e8f8ef;border-color:#bfe8cf}
  .wa-conexao.alerta{background:var(--selo-claro);border-color:rgba(227,168,43,.5)}
  .qr-modal{width:min(460px,100%);text-align:left}
  .qr-img{display:block;width:280px;height:280px;margin:12px auto;border-radius:12px;box-shadow:0 0 0 1px var(--grid)}
  .qr-passos{margin:10px 0 0 18px;display:grid;gap:4px;font-size:13.5px}
  .qr-codigo{font-family:var(--f-num);font-size:30px;letter-spacing:.2em;text-align:center;padding:18px;margin:12px 0;background:#f6efdc;border-radius:12px}
  /* ===== Identidade da logo oficial: marinho profundo + dourado metálico ===== */
  :root{--toga:#060f26;--toga-2:#0b1a3d;--selo:#e2b13c;--selo-claro:#fbf1d6;--ouro:linear-gradient(135deg,#fbe7a1 0%,#e2b13c 45%,#b07a12 100%);--f-marca:"Cinzel",Georgia,serif}
  nav{background:radial-gradient(130% 55% at 0% 0%,#163474 0%,transparent 62%),radial-gradient(90% 40% at 100% 100%,rgba(59,124,240,.18) 0%,transparent 70%),var(--toga)}
  nav .marca{gap:11px}
  nav .marca img{width:40px;height:40px;flex:none;filter:drop-shadow(0 4px 10px rgba(226,177,60,.25))}
  nav .marca b{display:block;font-family:var(--f-marca);font-size:14.5px;letter-spacing:.06em;text-transform:uppercase;background:linear-gradient(180deg,#fff,#d9dde6);-webkit-background-clip:text;background-clip:text;color:transparent}
  nav .marca small{font-family:var(--f-marca);font-size:9.5px;letter-spacing:.42em;text-transform:uppercase;background:var(--ouro);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:2px}
  nav a.on{background:linear-gradient(90deg,rgba(226,177,60,.18),rgba(226,177,60,.04))}
  nav a.on::before{background:var(--ouro)}
  .btn.ouro,.paleta-item.on .paleta-ic{background:var(--ouro);color:#1b1203}
  .btn:not(.sec):not(.ouro):not(.perigo){background:linear-gradient(180deg,#132a5a,#0b1a3d);box-shadow:inset 0 0 0 1px rgba(226,177,60,.25)}
  .topo h1{font-family:"Cormorant Garamond","Bricolage Grotesque",serif}
  .login{background:radial-gradient(90% 70% at 15% 10%,#163474 0%,transparent 60%),radial-gradient(60% 50% at 100% 100%,rgba(226,177,60,.12),transparent 70%),var(--toga)}
  .login-marca{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:4px}
  .login-marca img{filter:drop-shadow(0 8px 18px rgba(226,177,60,.3));margin-bottom:6px}
  .login-marca b{font-family:var(--f-marca);font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--toga)}
  .login-marca small{font-family:var(--f-marca);font-size:11px;letter-spacing:.45em;text-transform:uppercase;color:#b07a12}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="raiz"></div>
<div id="tip"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="robo.js"></script>
<script src="app.js"></script>
</body>
</html>
